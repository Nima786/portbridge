name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for example v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Work out the version
        id: v
        env:
          # Passed through the environment, never pasted into the script, so a
          # tag name cannot run as a command.
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a release tag: $tag"; exit 1 ;;
          esac
          case "$tag" in
            *[!a-zA-Z0-9.+-]*) echo "not a release tag: $tag"; exit 1 ;;
          esac
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "bare=${tag#v}" >>"$GITHUB_OUTPUT"

      # The same checks as every push, so a release can never be cut from
      # something CI would have refused.
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check the scripts
        run: |
          bash -n install.sh
          bash -n scripts/portbridge-menu
          bash -n scripts/portbridge-firewall
          bash -n scripts/portbridge-tune
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -s bash -S warning install.sh scripts/portbridge-menu scripts/portbridge-firewall scripts/portbridge-tune

      - name: Test before releasing
        run: |
          go vet ./...
          go test -race -count=1 -timeout 15m ./...

      - name: Build the archives
        env:
          TAG: ${{ steps.v.outputs.tag }}
          BARE: ${{ steps.v.outputs.bare }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            stage="stage-$arch"
            mkdir -p "$stage/scripts" "$stage/packaging"

            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=$TAG" -o "$stage/portbridge" .

            cp scripts/portbridge-menu scripts/portbridge-firewall scripts/portbridge-tune "$stage/scripts/"
            cp packaging/*.service "$stage/packaging/"
            cp README.md LICENSE "$stage/"
            chmod 755 "$stage/portbridge" "$stage/scripts/"*

            tar -czf "dist/portbridge_${BARE}_linux_${arch}.tar.gz" -C "$stage" .
          done

          cd dist
          sha256sum ./*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: PortBridge ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
