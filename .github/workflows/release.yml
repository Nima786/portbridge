name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for example v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            tag='${{ github.event.inputs.tag }}'
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "bare=${tag#v}" >>"$GITHUB_OUTPUT"

      - name: Test before releasing
        run: |
          go vet ./...
          go test -count=1 -timeout 15m ./...

      - name: Build the archives
        env:
          TAG: ${{ steps.v.outputs.tag }}
          BARE: ${{ steps.v.outputs.bare }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            stage="stage-$arch"
            mkdir -p "$stage/scripts" "$stage/packaging"

            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=$TAG" -o "$stage/portbridge" .

            cp scripts/portbridge-menu scripts/portbridge-firewall scripts/portbridge-tune "$stage/scripts/"
            cp packaging/portbridge@.service "$stage/packaging/"
            cp README.md LICENSE "$stage/"
            chmod 755 "$stage/portbridge" "$stage/scripts/"*

            tar -czf "dist/portbridge_${BARE}_linux_${arch}.tar.gz" -C "$stage" .
          done

          cd dist
          sha256sum ./*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: PortBridge ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
